services:
  db:
    image: postgres:16-alpine
    container_name: xazavier-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: xazavier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xazavier"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xazavier-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/xazavier?sslmode=disable
      JWT_SECRET: change-this-secret-key-to-at-least-32-characters
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      CORS_ALLOWED_ORIGINS: "*"
      AUTO_MIGRATE: "true"
      LOG_LEVEL: info
    ports:
      - "8080:8080"

volumes:
  pgdata:
